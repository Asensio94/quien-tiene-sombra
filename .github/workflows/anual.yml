name: Pasada anual

# Una pasada al año basta: el INE publica la renta por sección a finales de octubre y las capas
# de árboles cambian cada tres años. A mano sirve para rehacer una ciudad o solo la página.
on:
  schedule:
    - cron: "0 5 10 11 *"
  workflow_dispatch:
    inputs:
      city:
        description: "Ciudad (slug, p. ej. madrid; vacío = todas)"
        required: false
      income_year:
        description: "Año de renta del INE (vacío = el último publicado)"
        required: false
      web_only:
        description: "Solo rehacer la página con las ciudades ya calculadas"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: anual
  cancel-in-progress: false

jobs:
  anual:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Copernicus and INE downloads (several GB for all cities) are kept between runs.
      - uses: actions/cache@v4
        with:
          path: data/cache
          key: cache-${{ github.run_id }}
          restore-keys: cache-

      - name: Ciudades
        if: ${{ !inputs.web_only }}
        env:
          CDSE_USER: ${{ secrets.CDSE_USER }}
          CDSE_PASSWORD: ${{ secrets.CDSE_PASSWORD }}
          CITY: ${{ inputs.city }}
          INCOME_YEAR: ${{ inputs.income_year }}
        run: |
          ARGS=""
          [ -n "$CITY" ] && ARGS="$ARGS --city $CITY"
          [ -n "$INCOME_YEAR" ] && ARGS="$ARGS --income-year $INCOME_YEAR"
          python -m shade run $ARGS

      - name: Página
        run: python -m shade web

      - name: Guardar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/sections data/validation docs
          git diff --cached --quiet && exit 0
          git commit -m "Pasada anual: secciones y página"
          git push
